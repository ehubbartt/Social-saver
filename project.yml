name: SocialSaver
options:
  bundleIdPrefix: com.ehubbartt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
targets:
  SocialSaver:
    type: application
    platform: iOS
    sources:
      - SocialSaver
      - Shared
    dependencies:
      - package: Supabase
        product: Supabase
      - target: ShareExtension
    entitlements:
      path: SocialSaver/SocialSaver.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ehubbartt.socialsaver
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.ehubbartt.socialsaver.shared
    info:
      path: SocialSaver/Info.plist
      properties:
        CFBundleDisplayName: SocialSaver
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Used to show saved places near you on the map.
        ITSAppUsesNonExemptEncryption: false
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ehubbartt.socialsaver
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.ehubbartt.socialsaver.shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: SocialSaver
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
